# ai-model-radar configuration
# Each source can be toggled with `enabled`. Sources whose credentials are
# missing (e.g. provider API keys) are skipped with a warning.

huggingface:
  enabled: true
  # New uploads from these orgs/users are reported.
  authors:
    - meta-llama
    - Qwen
    - deepseek-ai
    - mistralai
    - google
    - microsoft
    - nvidia
    - openai
    - allenai
    - ibm-granite
    - CohereLabs
    - moonshotai
    - zai-org
    - MiniMaxAI
    - tencent
    - baidu
    - XiaomiMiMo
    - LGAI-EXAONE
    - naver-hyperclovax
    - upstage
    - kakaocorp
    - HuggingFaceTB
    - stepfun-ai
    - ByteDance-Seed
    - Aleph-Alpha
    - ai21labs
    - black-forest-labs
    - stabilityai
    - Lightricks
    - apple
    - amazon
    - Salesforce
    - inclusionAI
    - OpenGVLab
    - rednote-hilab
    - swiss-ai
    - skt
    - K-intelligence
    - trillionlabs
  per_author_limit: 30
  # Skip derivative repos (quantizations, adapters) by name pattern.
  exclude_patterns:
    - "(?i)[-_.]gguf($|[-_.])"
    - "(?i)[-_.](awq|gptq|mlx|exl2|exl3|onnx|bnb|fp8|fp4|nvfp4|mxfp4|int4|int8|w4a16|w8a8)($|[-_.])"
    - "(?i)[-_.]?\\d+(\\.\\d+)?bpw"
    - "(?i)[-_.]\\d+bit($|[-_.])"
    - "(?i)[-_./](lora|adapter|eagle\\d*|dflash|mtp)($|[-_.])"
  # Also report any model that newly enters the global top-N trending list.
  trending_top_n: 30

providers:
  enabled: true
  # Each provider is used only if its API key secret is set.
  openai: {env: OPENAI_API_KEY}
  anthropic: {env: ANTHROPIC_API_KEY}
  gemini: {env: GEMINI_API_KEY}
  mistral: {env: MISTRAL_API_KEY}
  xai: {env: XAI_API_KEY}
  deepseek: {env: DEEPSEEK_API_KEY}

github_releases:
  enabled: true
  per_repo_limit: 5
  include_prereleases: false
  repos:
    - vllm-project/vllm
    - sgl-project/sglang
    - NVIDIA/TensorRT-LLM
    - huggingface/transformers
    - huggingface/text-generation-inference
    - ggml-org/llama.cpp
    - ollama/ollama
    - microsoft/DeepSpeed
    - pytorch/pytorch
    - flashinfer-ai/flashinfer
    - Dao-AILab/flash-attention
    - LMCache/LMCache
    - ai-dynamo/dynamo

papers:
  enabled: true
  hf_daily_papers: true
  hf_daily_min_upvotes: 10
  arxiv:
    enabled: true
    max_results: 30
    # arXiv API search query. Only titles that typically announce a model.
    query: >-
      (cat:cs.CL OR cat:cs.LG OR cat:cs.AI OR cat:cs.CV)
      AND (ti:"technical report" OR ti:"model card" OR ti:"open-weight"
      OR ti:"open weight" OR ti:"model family")

news:
  enabled: true
  per_feed_limit: 30
  # With filter: true, an item is reported only if its title/summary matches
  # at least one release keyword AND at least one model keyword
  # (case-insensitive substring match).
  release_keywords:
    - release
    - launch
    - unveil
    - introduc
    - announc
    - debut
    - now available
    - open-source
    - open source
    - open-weight
    - open weights
    - 출시
    - 공개

  model_keywords:
    - model
    - LLM
    - GPT
    - Claude
    - Gemini
    - Gemma
    - Llama
    - Qwen
    - DeepSeek
    - Mistral
    - Grok
    - Phi-
    - Nemotron
    - Kimi
    - GLM
    - MiniMax
    - EXAONE
    - HyperCLOVA
    - 모델
  feeds:
    # filter: false -> every new item is reported (official model-lab blogs)
    - {name: OpenAI News, url: "https://openai.com/news/rss.xml", filter: true}
    - name: Google DeepMind
      url: "https://deepmind.google/blog/rss.xml"
      # Tried in order if the main URL fails or returns a non-feed page.
      fallback_urls: ["https://blog.google/technology/google-deepmind/rss/"]
      filter: false
    - {name: Google AI Blog, url: "https://blog.google/technology/ai/rss/", filter: true}
    - {name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml", filter: true}
    - {name: NVIDIA Blog, url: "https://blogs.nvidia.com/feed/", filter: true}
    - {name: Simon Willison, url: "https://simonwillison.net/atom/everything/", filter: true}
    - {name: The Decoder, url: "https://the-decoder.com/feed/", filter: true}
    - {name: MarkTechPost, url: "https://www.marktechpost.com/feed/", filter: true}
    - {name: TechCrunch AI, url: "https://techcrunch.com/category/artificial-intelligence/feed/", filter: true}
    - {name: The Verge AI, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", filter: true}
    - {name: MIT Technology Review AI, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed", filter: true}
    - {name: AI타임스, url: "https://www.aitimes.com/rss/allArticle.xml", filter: true}

notify:
  github_issue:
    enabled: true
    labels: [new-models]
  telegram:
    # Used only when TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are set.
    enabled: true

# Topics followed in addition to new models. Each appears as its own section
# ("🔎 <name>") in the digest.
#   keywords:    prefilter (case-insensitive, matched at word start) for news
#                articles and HF Daily Papers; anything matching is passed on.
#   description: what the topic is really about; Claude uses it to keep only
#                genuinely relevant items, so keywords can be broad.
#   arxiv:       also search new arXiv papers for these keywords (title/abstract).
topics:
  - name: LLM 서빙·추론 최적화
    description: >-
      LLM inference and serving systems: KV cache management and compression,
      batching and scheduling, speculative decoding, prefill/decode
      disaggregation, parallelism and MoE serving, serving simulators and
      performance modeling, inference hardware.
    keywords:
      - KV cache
      - KV-cache
      - speculative decoding
      - disaggregated
      - prefill
      - continuous batching
      - PagedAttention
      - LLM serving
      - LLM inference
      - inference engine
      - serving system
    arxiv: true
    arxiv_max_results: 20

# Post-processing with Claude: keep only real model releases (plus notable
# serving/framework releases) and write a Korean digest. Needs the
# ANTHROPIC_API_KEY secret; without it the raw filtered list is sent.
digest:
  enabled: true
  model: claude-opus-5-5
  effort: medium
  max_items: 400
  max_per_topic: 3
