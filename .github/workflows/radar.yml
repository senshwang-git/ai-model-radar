name: AI model radar

on:
  schedule:
    # Daily at 23:47 UTC (08:47 KST)
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Send notifications (uncheck to only update state)"
        type: boolean
        default: true
      lookback_date:
        description: "Lookback (no notify/state): list items published on this UTC date, YYYY-MM-DD or YYYY-MM-DD..YYYY-MM-DD"
        type: string
        default: ""
      lookback_telegram:
        description: "With lookback_date: also send the result to Telegram"
        type: boolean
        default: false
      test_telegram:
        description: "Only send a Telegram test message (no scan)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Claude Code CLI: lets the digest run on a Pro/Max subscription
      # (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
      - run: npm install -g @anthropic-ai/claude-code

      - name: Scan sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python -m radar --test-telegram
          elif [ -n "${{ inputs.lookback_date }}" ]; then
            range="${{ inputs.lookback_date }}"
            extra=""
            [ "${{ inputs.lookback_telegram }}" = "true" ] && extra="--send-telegram"
            python -m radar --since "${range%%..*}" --until "${range##*..}" $extra
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.notify }}" = "false" ]; then
            python -m radar --no-notify
          else
            python -m radar
          fi

      - name: Commit state
        if: ${{ inputs.test_telegram != true && inputs.lookback_date == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update radar state [skip ci]"
          git push

